
services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: mysql://${APP_DB_USER:-app}:${APP_DB_PASSWORD:-app}@mysql:3306/${APP_DB_NAME:-app}?serverVersion=8.0.41&charset=utf8mb4
    volumes:
      - ./:/var/www:delegated
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      php:
        condition: service_started
    ports:
      - "${NGINX_PORT:-8081}:80"
    volumes:
      - ./:/var/www:delegated
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public
      - internal
      - my_shop_public

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    working_dir: /var/www
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    command: sh -c "npm install && npm run dev -- --watch"
    volumes:
      - ./:/var/www:delegated
    depends_on:
      - php
    networks:
      - internal

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${APP_DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${APP_DB_NAME:-app}
      MYSQL_USER: ${APP_DB_USER:-app}
      MYSQL_PASSWORD: ${APP_DB_PASSWORD:-app}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:-33061}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      # Uncomment the following line to disable HTTPS,
      #SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      # Set the URL of your Symfony project (without trailing slash!) as value of the cors_origins directive
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://127.0.0.1:8000
    # Comment the following line to disable the development mode
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost/healthz"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

networks:
  public:
    name: my_shop_web
    driver: bridge
  internal: {}
  my_shop_public:
    name: my_shop_public
    driver: bridge

volumes:
  mysql_data: {}

###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
